const AREA_KEYS = ['understand','method','team','experience','price','compliance','partner'];
// Typical working days for a first draft, by proposal playbook.
const BASE_DAYS = {rfq:2, itb:4, rfp:12, donor:15, eoi:3, preq:2, frame:8, concept:4, full:15, match:8, csr:6, challenge:5, award:3, accel:5, invest:7, impact:10, speaker:1, exhibit:1};
// Share of the effort per area, by playbook. Missing playbooks use "default".
const AREA_W = {
  default:{understand:20, method:25, team:15, experience:15, price:10, compliance:15},
  rfq:{understand:5, method:0, team:0, experience:10, price:45, compliance:40},
  itb:{understand:0, method:5, team:5, experience:10, price:30, compliance:50},
  donor:{understand:15, method:20, team:30, experience:15, price:10, compliance:10},
  eoi:{understand:15, method:10, team:30, experience:40, price:0, compliance:5},
  preq:{understand:5, method:0, team:10, experience:30, price:0, compliance:55},
  frame:{understand:10, method:20, team:25, experience:30, price:15, compliance:0},
  concept:{understand:35, method:35, team:10, experience:15, price:5, compliance:0}
};
const FIX_DAYS = {partner:1.5, consortium:2, register:1, hire:2, guarantee:1};
const DEC_KEY = {go:'dGo', cond:'dCond', no:'dNo'};
const decLabel = k => sm(DEC_KEY[k]);

function screenOf(o){
  const a = bidAnalysis(o), w = writerOf(o), tp = pbType(w.type), reqs = a.reqs, sc = tp.scope==='both' ? w.scope : tp.scope;
  // 1. fit: share of requirements met (must-haves count double; a partner-covered gap counts 0.8, an unknown 0.4)
  const wt = r => r.must ? 2 : 1, sv = {met:1, covered:.8, unknown:.4, gap:0};
  const tot = reqs.reduce((s,r)=>s+wt(r),0), got = reqs.reduce((s,r)=>s+wt(r)*sv[r.status],0);
  const fit = tot ? Math.round(got/tot*100) : 0, fitLv = fit>=75 ? 'high' : fit>=55 ? 'mid' : 'low';
  const nOk = reqs.filter(r=>r.status==='met' || r.status==='covered').length;
  // 2. chance of winning: from the 8-criteria score, capped when a must-have is still open
  const winLv = a.decision==='no' ? 'low' : a.score>=75 ? 'high' : a.score>=60 ? 'mid' : 'low';
  const holds = Object.keys(BID_WEIGHTS).map(k=>[k, w.bid.ov[k] || a.auto[k][0]]).filter(x=>x[1]<=2 || (x[1]===3 && !['rel','comp'].includes(x[0])))
    .sort((x,y)=>x[1]-y[1]).slice(0,2).map(x=>L(BT.crit[x[0]])).join(lang()==='ar' ? '، ' : ', ');
  // 3. effort by area, then the total time
  const key = tp.id, left = Math.max(0, diffDays(o.deadline, refDate())), workdays = Math.round(left*5/7);
  const gapsN = reqs.filter(r=>r.status==='gap').length, unkN = reqs.filter(r=>r.status==='unknown').length;
  const kxGaps = reqs.filter(r=>/^kx/.test(r.id) && r.status==='gap').length, regGap = reqs.some(r=>r.id==='reg' && r.status==='gap');
  let raw = (BASE_DAYS[key] ?? 6) + gapsN*.5 + kxGaps + a.using.length*1.5 + (regGap ? 1 : 0) + unkN*.25;
  const pct = profilePct(); raw *= pct>=70 ? .85 : pct<30 ? 1.2 : 1;
  const wts = {...(AREA_W[key] || AREA_W.default)}, why = {};
  const boost = (k, n, label) => { wts[k] = (wts[k]||0) + n; (why[k] = why[k] || []).push(label); };
  reqs.filter(r=>r.status==='gap' || r.status==='unknown').forEach(r=>{
    const n = r.status==='gap' ? 8 : 3;
    if (r.id==='exp' || r.id==='sector' || r.id.startsWith('cap-')) boost('experience', n, r.label);
    else if (r.id.startsWith('kx') || r.id==='lead') boost('team', n, r.label);
    else if (['reg','guar','lang'].includes(r.id)) boost('compliance', n, r.label);
    else if (r.id==='place') boost('understand', r.status==='gap' ? 5 : 2, r.label);
  });
  if (a.using.length) boost('partner', 12 + 4*(a.using.length-1), a.using.map(e=>esc(e.pa.name)).join(', '));
  const sumW = AREA_KEYS.reduce((s,k)=>s+(wts[k]||0),0) || 1;
  const areas = AREA_KEYS.filter(k=>wts[k]>0).map(k=>({k, days:Math.max(.5, Math.round(wts[k]/sumW*raw*2)/2), why:(why[k]||[])[0]||'', more:(why[k]||[]).length}))
    .sort((x,y)=>y.days-x.days);
  const days = Math.max(1, areas.reduce((s,x)=>s+x.days,0)), maxD = areas.length ? areas[0].days : 1;
  areas.forEach(x=>{ x.lv = x.days>=maxD*.75 ? 'hi' : x.days>=maxD*.4 ? 'mid' : 'low'; });
  const ratio = workdays/days, tStatus = ratio>=3 ? 'tComf' : ratio>=1.5 ? 'tOk' : ratio>=1 ? 'tTight' : 'tNo', tLv = ratio>=1.5 ? 'high' : ratio>=1 ? 'mid' : 'low';
  const startBy = addDays(o.deadline, -(Math.ceil(days*7/5/.6) + 2)), startNow = diffDays(startBy, refDate()) <= 0;
  // 4. wins and misses
  const wins = reqs.filter(r=>r.status==='met' || r.status==='covered').map(r=>({t:r.label, must:r.must, ev: r.status==='covered' ? sm('partnerHere',{x:esc(r.by)}) : (r.ev||'')}));
  ['fit','cap','value','risk'].forEach(k=>{ if ((w.bid.ov[k] || a.auto[k][0]) >= 4) wins.push({t:L(BT.crit[k]), must:false, ev:a.auto[k][1]}); });
  const fixTxt = r => r.fix==='guarantee' ? tt('fixGuar') : bt({partner:'fixPartner', consortium:'fixConsortium', register:'fixRegister', hire:'fixHire'}[r.fix]);
  const misses = reqs.filter(r=>r.status==='gap' || r.status==='unknown').map(r=>({t:r.label, must:r.must, status:r.status, fix: r.status==='gap' ? fixTxt(r) : '', d: r.status==='gap' ? FIX_DAYS[r.fix] : .25,
    ev:'', sugg: a.sugg.find(e=>e.gaps.includes(r))}));
  if (tStatus==='tTight' || tStatus==='tNo') misses.push({t:sm('time'), must:false, status:'gap', fix:sm(tStatus), d:0, ev:sm('timeSub',{l:left, w:workdays})});
  if ((w.bid.ov.value || a.auto.value[0]) <= 2) misses.push({t:L(BT.crit.value), must:false, status:'gap', fix:'', d:0, ev:a.auto.value[1]});
  // 5. the two recommendations with the biggest effect
  const cand = [], used = new Set(w.bid.partners);
  a.sugg.filter(e=>!used.has(e.pa.name)).forEach(e=>{
    const prev = w.bid.partners.slice(); w.bid.partners = [...prev, e.pa.name];
    let after; try { after = bidAnalysis(o); } finally { w.bid.partners = prev; }
    cand.push({impact:100 + (after.score - a.score), t:sm('rPartner',{x:esc(e.pa.name), y:bt(e.form)}), why:sm('rPartnerWhy',{x:e.gaps.map(r=>r.label).join(' · ')}),
      fx:sm('rPartnerFx',{a:a.score, b:after.score, d:decLabel(after.decision)}), act:{a:'bid-use', v:e.pa.name, label:sm('usePartner')}});
  });
  if (a.openNoPartner.length) cand.push({impact:90, t:sm('rFind',{x:a.openNoPartner.slice(0,2).map(r=>r.label).join(' · ') + (a.openNoPartner.length > 2 ? ' +' + (a.openNoPartner.length-2) : '')}), why:sm('rFindWhy'), fx:sm('rFindFx'), act:{a:'profile-open', v:'partners', label:sm('openProfile')}});
  if (!w.tor) cand.push({impact:88, t:sm('rTor'), why:sm('rTorWhy'), fx:sm('rTorFx')});
  if (tStatus==='tTight' || tStatus==='tNo') cand.push({impact:85, t:sm('rStart'), why:sm('rStartWhy',{n:days, w:workdays}), fx:sm('rStartFx')});
  if (reqs.some(r=>r.id==='reg' && r.status==='gap')) cand.push({impact:80, t:sm('rReg',{x:bt(sc==='intl' ? 'regIntl' : 'regNat')}), why:sm('rRegWhy'), fx:sm('rRegFx')});
  if (a.decision==='no' && !a.sugg.length) cand.push({impact:75, t:sm('rSkip',{n:days}), why:sm('rSkipWhy'), fx:sm('rSkipFx')});
  if (w.tor && w.tor.found && !w.tor.found.consortium && (a.sugg.length || a.using.length)) cand.push({impact:70, t:sm('rAsk'), why:sm('rAskWhy'), fx:sm('rAskFx')});
  if (unkN >= 2) cand.push({impact:60, t:sm('rFill',{n:unkN}), why:sm('rFillWhy'), fx:sm('rFillFx'), act:{a:'profile-open', v:'', label:sm('openProfile')}});
  const proj = recs('projects').find(r=>pfFilled(r.title) && r.sector===SECTOR_MAP[o.sector]);
  if (proj) cand.push({impact:50, t:sm('rLead',{x:esc(proj.title)}), why:sm('rLeadWhy'), fx:sm('rLeadFx')});
  const topRecs = cand.sort((x,y)=>y.impact-x.impact).slice(0,2);
  return {a, w, tp, fit, fitLv, nOk, nTot:reqs.length, winLv, holds, days, left, workdays, tStatus, tLv, startBy, startNow, areas, maxD, wins, misses, recs:topRecs};
}

function memoHtml(o){
  const s = screenOf(o), a = s.a, w = s.w, hint = x => `<span class="hint" style="margin:0">${x}</span>`;
  const lv = {high:sm('winHigh'), mid:sm('winMid'), low:sm('winLow')}, fitTxt = {high:sm('fitStrong'), mid:sm('fitPart'), low:sm('fitWeak')};
  const banner = a.empty ? `<div class="notice amber">${ic('alert','sm')}<span>${sm('lowConf')} <button class="link-btn" data-act="profile-open" data-id="${o.id}">${bt('fillProfile')}</button></span></div>`

function recordDecision(o, choice, extra={}){

  w.decision = {choice, at, suggested:s.a.decision, fit:s.fit, score:s.a.score, days:s.days, partners:[...(w.bid.partners||[])], ...extra};
  w.decisionLog = w.decisionLog || []; w.decisionLog.unshift({choice, at, ...extra}); w.decisionLog.length = Math.min(w.decisionLog.length, 20);

}

      <div><span>${t('value')}</span><b class="num">${fmtMoney(o.estimatedAwardValue)}</b></div><div><span>${t('sector')}</span><b>${esc(L(SECTORS[o.sector]))}</b></div><div><span>${t('country')}</span><b>${esc(L(COUNTRIES[o.country]))}</b></div></div>
    <div class="tags">${o.tags.map(tg=>`<span class="tag">${esc(L(TAGS[tg]))}</span>`).join('')}<span class="tag">${esc(t('discovered',{date:fmtDate(o.discoveredAt)}))}</span></div>
    <div class="bi"><div class="en" lang="en" dir="ltr"><h3 style="font-size:11px;color:var(--subtle);margin:0 0 6px">ENGLISH</h3><h4>${esc(o.titleEn)}</h4><p>${esc(o.descriptionEn)}</p></div>
      <div class="ar" lang="ar" dir="rtl"><h3 style="font-size:11px;color:var(--subtle);margin:0 0 6px">العربية</h3><h4>${esc(o.titleAr)}</h4><p>${esc(o.descriptionAr)}</p></div></div>
    <div class="blk"><h3>${t('milestones')}</h3><div class="ms">${ms}</div></div>
    <div class="blk"><h3>${t('workflow')}</h3><div class="chips">${wf}</div></div>
    <div class="blk"><h3>${t('history')}</h3><div class="timeline">${hist}</div></div>`,
    foot:`${stageActs.join('')}<button class="btn" data-act="close-modal">${t('close')}</button>`});
}
function dayModal(day){
  const evs = calendarOpps().flatMap(milestonesOf).filter(e=>e.date===day);
  return shell({icon:'calendar', title:t('eventsOn',{date:fmtDate(day,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}), size:'narrow',
    body:`<div class="day-list">${evs.map(wkEv).join('')}</div>`, foot:`<button class="btn" data-act="close-modal">${t('close')}</button>`});
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function resetDemo(){
  data = generateSeed();
  data.audit.unshift({id:'reset-'+Date.now(), opportunityId:null, action:'demo_reset', detail:{}, at:nowIso()});
  Object.assign(prefs, {period:'q4-2026', stage:'writing', view:'pipeline', calMode:'month', calCursor:null, calStage:'all', calFunder:'all'});
  ui.search=''; ui.expanded={};
  savePrefs();
  const ok = persist();
  ui.modal = null; $('#modal-root').innerHTML=''; document.body.style.overflow='';
  render();
  toast(ok ? t('resetDone') : t('storageFail'), ok?'ok':'warn');
}
function step(id, dir){
  const o = getOpp(id); const i = STAGES.indexOf(o.stage) + dir;
  if (i<0 || i>=STAGES.length) return;
  moveOpp(id, STAGES[i]);
}

document.addEventListener('click', e=>{
  const ov = e.target.closest('[data-overlay]');
  if (ov && e.target===ov){ closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el){
    if (ui.popover && !e.target.closest('.popover')){ ui.popover=null; render(); }
    return;
  }
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (act!=='pop' && ui.popover && !el.closest('.popover')){ ui.popover = null; }
  switch(act){
    case 'lang': prefs.lang = lang()==='en'?'ar':'en'; savePrefs(); render(); if (ui.modal) renderModal(); break;
    case 'pop': ui.popover = ui.popover===v ? null : v; render(); { const p=$('.popover'); const f = p && p.querySelector('button:not([disabled])'); f && f.focus(); } break;
    case 'mark-all': data.notifications.forEach(n=>n.read=true); commit(); render(); break;
    case 'notif': { const n = data.notifications.find(x=>x.id===el.dataset.id); n.read = true; commit(); ui.popover=null; render(); if (n.opportunityId) openModal('details', n.opportunityId); break; }
    case 'date-mode': prefs.dateMode = v; prefs.calCursor = null; savePrefs(); ui.popover=null; render(); break;
    case 'view': prefs.view = v; savePrefs(); render(); break;
    case 'reset': openModal('reset'); break;
    case 'confirm-reset': resetDemo(); break;
    case 'stage': prefs.stage = v; savePrefs(); render(); break;
    case 'advance': step(id, 1); break;
    case 'back': step(id, -1); break;
    case 'details': openModal('details', id); break;
    case 'ai': openModal('ai', id); break;
    case 'self': openModal('self', id); break;
    case 'expert': openModal('expert', id); break;
    case 'outcome': openModal('outcome', id); break;
    case 'more': ui.expanded[v] = !ui.expanded[v]; renderWorkspaceOnly(); break;
    case 'close-modal': closeModal(); break;
    case 'cal-prev': case 'cal-next': {
      const dir = act==='cal-next'?1:-1, cur = calCursor();
      if (prefs.calMode==='month'){ const y=+cur.slice(0,4), m=+cur.slice(5,7)-1+dir; const d=new Date(Date.UTC(y,m,1)); prefs.calCursor = fmtDayIso(d.getTime()); }
      else prefs.calCursor = addDays(cur, 7*dir);
      savePrefs(); renderWorkspaceOnly(); $(`[data-fk="${act}"]`)?.focus(); break; }
    case 'cal-today': prefs.calCursor = prefs.calMode==='month' ? refDate().slice(0,8)+'01' : refDate(); savePrefs(); renderWorkspaceOnly(); $('[data-fk="cal-today"]')?.focus(); break;
    case 'cal-mode': {
      const cur = calCursor();
      if (v==='week'){ const ref = refDate(); prefs.calCursor = ref.slice(0,7)===cur.slice(0,7) ? ref : cur; }
      else prefs.calCursor = cur.slice(0,8)+'01';
      prefs.calMode = v; savePrefs(); renderWorkspaceOnly(); $(`[data-fk="calmode-${v}"]`)?.focus(); break; }
    case 'cal-day': openModal('day', null, v); break;
    case 'pb-scope': { const o = getOpp(id); writerOf(o).scope = v; o.updatedAt = nowIso(); commit(); rerenderWriter(); $(`[data-act="pb-scope"][data-v="${v}"]`)?.focus(); break; }
    case 'pb-restore': { const a = (writerOf(getOpp(id)).attempts||[])[+v]; if (!a) break; ui.modal.draftText = a.text; const b = $('#modal-root .m-b'), top = b ? b.scrollTop : 0; renderModal(); $('#modal-root .m-b').scrollTop = top; $('#draft').focus(); toast(t('pbRestored'),'ok'); break; }
    case 'profile-open': ui.popover = null; render(); openModal('profile', null, {sec: el.dataset.v || null, back: id || null}); break;
    case 'tor-ai': { const w = writerOf(getOpp(id)); w.torAi = v; commit(); rerenderWriter(); break; }
    case 'tor-rm': { delete writerOf(getOpp(id)).tor; commit(); rerenderWriter(); break; }
    case 'tor-type': { const w = writerOf(getOpp(id)), tp = pbType(v); w.type = tp.id; if (tp.scope !== 'both') w.scope = tp.scope; commit(); rerenderWriter(); break; }
    case 'dc-go': case 'dc-cond': { const o = getOpp(id); recordDecision(o, act==='dc-go' ? 'go' : 'cond'); ui.modal.pickNo = false; rerenderWriter(); document.querySelectorAll('#modal-root .phase')[1]?.scrollIntoView({block:'start'}); break; }
    case 'dc-no': ui.modal.pickNo = true; rerenderWriter(); $('#dc-reason')?.focus(); break;
    case 'dc-no-cancel': ui.modal.pickNo = false; rerenderWriter(); break;
    case 'dc-no-save': { const r = $('#dc-reason').value; if (!r){ toast(sm('needReason'),'warn'); $('#dc-reason').focus(); return; }
      recordDecision(getOpp(id), 'no', {reason:r, note:$('#dc-note').value.trim()}); ui.modal.pickNo = false; rerenderWriter(); break; }
    case 'dc-change': { const w = writerOf(getOpp(id)); delete w.decision; ui.modal.pickNo = false; commit(); rerenderWriter(); break; }
    case 'bid-use': { const w = writerOf(getOpp(id)); w.bid.partners = [...new Set([...(w.bid.partners||[]), v])]; commit(); rerenderWriter(); break; }
    case 'bid-drop': { const w = writerOf(getOpp(id)); w.bid.partners = (w.bid.partners||[]).filter(x=>x!==v); commit(); rerenderWriter(); break; }
    case 'bid-score': { const w = writerOf(getOpp(id)), c = el.dataset.c; if (w.bid.ov[c] === +v) delete w.bid.ov[c]; else w.bid.ov[c] = +v; commit(); rerenderWriter(); $(`[data-act="bid-score"][data-c="${c}"][data-v="${v}"]`)?.focus(); break; }
    case 'pf-sec': ui.modal.extra.sec = v; ui.modal.extra.openRec = null; renderModal(); $(`[data-act="pf-sec"][data-v="${v}"]`)?.focus(); break;
    case 'pf-add': { e.preventDefault(); recs(v).push({}); ui.modal.extra.openRec = recs(v).length - 1; commit(); rerenderProfile(); const last = $$('.pf-rec').pop(); last && last.scrollIntoView({block:'nearest'}); last?.querySelector('input,select,textarea')?.focus(); break; }
    case 'pf-del': { e.preventDefault(); recs(v).splice(+el.dataset.i, 1); ui.modal.extra.openRec = null; commit(); rerenderProfile(); break; }
    case 'pf-rmfile': { const arr = pfGet(el.dataset.pk) || []; arr.splice(+el.dataset.i, 1); pfPut(el.dataset.pk, arr); commit(); rerenderProfile(); break; }
    case 'pb-rmfile': { const o = getOpp(id); writerOf(o).oldFiles.splice(+v, 1); commit(); $('#pb-filelist').innerHTML = pbFilesHtml(o); $('label[for="pb-files"]')?.focus(); break; }
    case 'export': exportIcs(); break;
    case 'save-draft': {
      const txt = $('#draft').value.trim();
      if (!txt){ toast(t('draftEmpty'),'err'); $('#draft').focus(); return; }
      const o = getOpp(id); o.generatedDraft = txt; o.donorAlignmentScore = +el.dataset.score; o.draftSavedAt = nowIso(); o.updatedAt = o.draftSavedAt;
      const w = writerOf(o); w.attempts = w.attempts || [];
      w.attempts.unshift({at:o.draftSavedAt, text:txt, type:w.type, scope:w.scope}); w.attempts.length = Math.min(w.attempts.length, 20);
      audit(id,'draft_saved',{length:txt.length, source:DemoProposalAssistant.source});
      commit(t('draftSavedToast',{id})); ui.modal.draftText = undefined; rerenderWriter(); ui.modal.draftText = undefined; break; }
    case 'request-expert': {
      const o = getOpp(id); if (o.expertReviewRequested) return;
      const pay = DemoPaymentProvider.requestCharge({amountUsd:199, opportunityId:id});
      o.expertReviewRequested = true; o.updatedAt = nowIso();
      data.reviewRequests.push({id:'rr-'+Date.now(), opportunityId:id, priceUsd:199, status:'requested_demo', paymentStatus:pay.status, requestedAt:o.updatedAt});
      data.notifications.unshift({id:'n'+Date.now(), type:'expert', opportunityId:id, createdAt:o.updatedAt, read:false});
      audit(id,'expert_review_requested',{priceUsd:199, payment:pay.status});
      commit(t('exDone',{id})); closeModal(); break; }
    case 'choose-outcome': {
      ui.modal.outcome = v;
      $$('.choice button').forEach(b=>b.setAttribute('aria-checked', String(b.dataset.v===v)));
      $('#f-won').classList.toggle('hidden', v!=='won'); $('#f-lost').classList.toggle('hidden', v!=='lost'); $('#oc-pick').classList.add('hidden');
      (v==='won'?$('#oc-value'):$('#oc-reason')).focus(); break; }
    case 'save-outcome': {
      const sel = ui.modal.outcome;
      if (!sel){ $('#oc-pick').classList.remove('hidden'); return; }
      if (sel==='won'){
        const raw = $('#oc-value').value.replace(/[,\s$]/g,''), val = Number(raw);
        const bad = !raw || !/^\d+(\.\d{1,2})?$/.test(raw) || !(val>0);
        $('#oc-value').setAttribute('aria-invalid', String(bad)); $('#oc-value-err').classList.toggle('hidden', !bad);
        if (bad){ $('#oc-value').focus(); return; }
        if (recordOutcome(id,'won',Math.round(val*100)/100,null)) commit(t('ocSavedWon',{id, v:fmtMoney(val)})); closeModal();
      } else {
        const r = $('#oc-reason').value;
        $('#oc-reason').setAttribute('aria-invalid', String(!r)); $('#oc-reason-err').classList.toggle('hidden', !!r);
        if (!r){ $('#oc-reason').focus(); return; }
        if (recordOutcome(id,'lost',null,r)) commit(t('ocSavedLost',{id, r:t('lr.'+r)})); closeModal();
      }
      break; }
  }
});
document.addEventListener('change', e=>{
  const el = e.target;
  if (el.id==='period'){ prefs.period = el.value; ui.expanded={}; savePrefs(); render(); }
  else if (el.id==='cal-stage'){ prefs.calStage = el.value; savePrefs(); renderWorkspaceOnly(); $('#cal-stage').focus(); }
  else if (el.id==='cal-funder'){ prefs.calFunder = el.value; savePrefs(); renderWorkspaceOnly(); $('#cal-funder').focus(); }
  else if (el.dataset.check){
    const o = getOpp(el.dataset.id), kind = el.dataset.check, key = el.dataset.key;
    const target = kind==='self' ? o.selfReviewChecklist : o.complianceChecklist;
    target[key] = el.checked; o.updatedAt = nowIso();
    audit(o.id,'checklist_updated',{kind,key,checked:el.checked});
    const ok = persist(); if (!ok) toast(t('storageFail'),'warn');
    const keys = kind==='self' ? SELF_KEYS : COMPLIANCE_KEYS, n = keys.filter(k=>target[k]).length;
    const p = $('#prog-'+kind); if (p) p.outerHTML = progressHtml(n, keys.length, 'prog-'+kind);
  }
  else if (el.id==='pb-type'){
    const o = getOpp(el.dataset.id), w = writerOf(o), tp = pbType(el.value);
    w.type = tp.id; if (tp.scope!=='both') w.scope = tp.scope;
    o.updatedAt = nowIso(); commit(); rerenderWriter(); $('#pb-type')?.focus();
  }
  else if (el.dataset.attach){
    const o = getOpp(el.dataset.id); writerOf(o).attach[el.dataset.attach] = el.checked;
    if (!persist()) toast(t('storageFail'),'warn');
    const [n,d] = pbAttachCount(o); $('#pb-attach-count').textContent = t('pbReady',{n,d});
  }
  else if (el.dataset.condkey !== undefined){
    const o = getOpp(el.dataset.id), w = writerOf(o); w.condDone = w.condDone || {}; w.condDone[el.dataset.condkey] = el.checked;
    if (!persist()) toast(t('storageFail'),'warn');
    const a = bidAnalysis(o), cc = $('#cond-count'); if (cc) cc.textContent = sm('condCount',{n:a.conds.filter(c=>w.condDone[c]).length, d:a.conds.length});
  }
  else if (el.dataset.pk){
    const pk = el.dataset.pk;
    if (el.dataset.file){ const arr = pfGet(pk) || []; [...el.files].forEach(f=>{ if (!arr.includes(f.name) && arr.length < 20) arr.push(f.name); }); pfPut(pk, arr); el.value = ''; commit(); rerenderProfile(); $(`label[for="${el.id}"]`)?.focus(); }
    else if (el.dataset.multi !== undefined){ pfPut(pk, $$(`[data-pk="${CSS.escape(pk)}"][data-multi]:checked`).map(x=>x.value)); if (!persist()) toast(t('storageFail'),'warn'); pfRefreshStatus(); }
    else { pfPut(pk, el.value); if (!persist()) toast(t('storageFail'),'warn'); pfRefreshStatus(); }
  }
  else if (el.id==='tor-file'){ const file = el.files[0]; el.value = ''; if (file) torUpload(getOpp(el.dataset.id), file); }
  else if (el.id==='pb-files'){
    const o = getOpp(el.dataset.id), w = writerOf(o);
    [...el.files].forEach(f=>{ if (!w.oldFiles.includes(f.name) && w.oldFiles.length < 10) w.oldFiles.push(f.name); });
    el.value = ''; commit(); $('#pb-filelist').innerHTML = pbFilesHtml(o);
  }
  else if (el.id==='oc-reason' && el.value){ el.setAttribute('aria-invalid','false'); $('#oc-reason-err').classList.add('hidden'); }
});
document.addEventListener('input', e=>{
  if (e.target.id==='q'){ ui.search = e.target.value; renderWorkspaceOnly(); }
  if (e.target.id==='oc-value'){ e.target.setAttribute('aria-invalid','false'); $('#oc-value-err').classList.add('hidden'); }
  if (e.target.dataset && e.target.dataset.pk && !e.target.dataset.file && e.target.type !== 'checkbox' && e.target.type !== 'radio'){
    pfPut(e.target.dataset.pk, e.target.value); pfRefreshStatus();
    const sum = e.target.closest('.pf-rec')?.querySelector('summary > span'); const f = e.target.dataset.pk.split(':');
    if (sum && f[0]==='r'){ const sec = PROFILE.sections.find(x=>x.record && x.record.id===f[1]); if (sec && sec.record.title===f[3]) sum.textContent = e.target.value || t('pfUntitled',{x:L(sec.record.label)}); }
    clearTimeout(ui.ansTimer); ui.ansTimer = setTimeout(()=>{ if (!persist()) toast(t('storageFail'),'warn'); }, 400);
  }
  if (e.target.dataset && e.target.dataset.ans){
    const o = getOpp(e.target.dataset.id); writerOf(o).answers[e.target.dataset.ans] = e.target.value;
    const [n,d] = pbAskCount(o); $('#pb-ask-count').textContent = t('pbAnswered',{n,d});
    clearTimeout(ui.ansTimer); ui.ansTimer = setTimeout(()=>{ if (!persist()) toast(t('storageFail'),'warn'); }, 400);
  }
});
document.addEventListener('keydown', e=>{
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); const q=$('#q'); q.focus(); q.select(); return; }
  if (e.key==='Escape'){
    if (ui.modal){ e.preventDefault(); closeModal(); return; }
    if (ui.popover){ const p = ui.popover; ui.popover=null; render(); $(`[data-fk="${p==='notif'?'bell':'profile'}"]`)?.focus(); return; }
    if (document.activeElement && document.activeElement.id==='q' && ui.search){ ui.search=''; render(); return; }
  }
  if (e.key==='Tab' && ui.modal){
    const f = $$('#modal-root button:not([disabled]), #modal-root input, #modal-root select, #modal-root textarea, #modal-root [tabindex="0"]').filter(x=>x.offsetParent!==null);
    if (!f.length) return;
    const first=f[0], last=f[f.length-1];
    if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
  const tab = e.target.closest && e.target.closest('[role=tab]');
  if (tab && (e.key==='ArrowLeft'||e.key==='ArrowRight')){
    const tabs = $$('[role=tab]', tab.parentElement), i = tabs.indexOf(tab);
    const dir = (e.key==='ArrowRight' ? 1 : -1) * (lang()==='ar' ? -1 : 1);
    const nxt = tabs[(i+dir+tabs.length)%tabs.length]; e.preventDefault(); nxt.click();
  }
});

/* ---- native drag & drop between Kanban columns ---- */
document.addEventListener('dragstart', e=>{
  const card = e.target.closest && e.target.closest('[data-card]'); if (!card) return;
  ui.dragId = card.dataset.card; card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ui.dragId);
});
document.addEventListener('dragend', ()=>{ ui.dragId=null; $$('.dragging').forEach(x=>x.classList.remove('dragging')); $$('.col.drop,.col.drop-no').forEach(c=>c.classList.remove('drop','drop-no')); });
document.addEventListener('dragover', e=>{
  const col = e.target.closest && e.target.closest('[data-col]'); if (!col || !ui.dragId) return;
  e.preventDefault();
  const o = getOpp(ui.dragId), ok = !(col.dataset.col==='outcomes' && o.stage!=='sent');
  e.dataTransfer.dropEffect = ok ? 'move' : 'none';
  $$('.col.drop,.col.drop-no').forEach(c=>{ if (c!==col) c.classList.remove('drop','drop-no'); });
  col.classList.add(ok ? 'drop' : 'drop-no');
});
document.addEventListener('drop', e=>{
  const col = e.target.closest && e.target.closest('[data-col]'); if (!col || !ui.dragId) return;
  e.preventDefault(); const id = ui.dragId; ui.dragId = null;
  $$('.col.drop,.col.drop-no').forEach(c=>c.classList.remove('drop','drop-no'));
  moveOpp(id, col.dataset.col);
});

/* ---------------- boot ---------------- */
(function init(){
  prefs = Object.assign({}, DEFAULT_PREFS, loadJSON(PREFS_KEY) || {});
  REFERENCE_FUNNEL = computeFunnel(generateSeed().opps, Q4_RANGE);
  const stored = loadJSON(DATA_KEY);
  data = stored && stored.version===1 && Array.isArray(stored.opps) ? stored : generateSeed();
  if (!stored) persist();
  render();
})();
</script>
